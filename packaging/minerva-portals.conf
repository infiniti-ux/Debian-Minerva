# xdg-desktop-portal backend preference for XDG_CURRENT_DESKTOP=Minerva.
# Sandboxed / portal-aware apps (file pickers, screenshots, screen share,
# settings queries) resolve to the GTK backend, the same one XFCE/LXQt use.
[preferred]
default=gtk
org.freedesktop.impl.portal.Settings=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Screenshot=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.OpenURI=gtk
