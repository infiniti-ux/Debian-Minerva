<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Minerva</title>
  <meta name="minerva-version" content="0.9.2">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/minerva.css">
  <script>
    // Window role: in a real Minerva X11 session each window (desktop, top
    // bar, dock, launcher, popovers…) is this same page with a #role hash.
    // Set the role before first paint so the right surface shows instantly.
    (function () {
      var ROLE_TITLES = {
        desktop: 'Minerva Desktop', topbar: 'Minerva Top Bar', dock: 'Minerva Dock',
        launcher: 'Minerva Launcher', wifi: 'Minerva Wi-Fi', audio: 'Minerva Audio',
        battery: 'Minerva Battery', calendar: 'Minerva Calendar', power: 'Minerva Power',
        shade: 'Minerva Notifications', settings: 'Minerva Settings'
      };
      var mode = (location.hash || '').replace(/^#/, '').split('?')[0];
      if (mode) {
        document.documentElement.dataset.mode = mode;
        document.title = ROLE_TITLES[mode] || 'Minerva';
      }
    })();
  </script>
</head>
<body class="theme-dark wallpaper-swirl">
  <script>
    // Apply the stored theme/wallpaper before first paint — no wrong-theme flash.
    (function () {
      try {
        var st = JSON.parse(localStorage.getItem('minerva.session.v1') || '{}');
        document.body.className = 'theme-' + (st.theme === 'light' ? 'light' : 'dark') +
          ' wallpaper-' + (['swirl', 'aurora', 'dusk', 'light', 'mesh'].indexOf(st.wallpaper) !== -1 ? st.wallpaper : 'swirl');
      } catch (e) {}
    })();
  </script>

  <!-- boot splash & first-run wizard removed: a real session starts on the desktop -->

  <!-- ===================================================== desktop -->
  <div id="desktop" class="desktop">
    <div id="wallpaper" class="wallpaper"></div>

    <!-- desktop widgets / icons -->
    <div id="desktop-layer" class="desktop-layer">
      <div class="desktop-widget">
        <div class="dw-date" id="dw-date"></div>
      </div>
      <div class="desktop-search" id="desktop-search">
        <span class="ds-icon" data-icon="search"></span>
        <input id="ds-input" type="text" placeholder="Search Minerva" autocomplete="off" spellcheck="false">
      </div>
      <div class="desktop-icons" id="desktop-icons"></div>
    </div>

    <!-- window layer -->
    <div id="windows" class="windows"></div>

    <!-- top status bar -->
    <header id="statusbar" class="statusbar">
      <div class="sb-left">
        <button class="sb-item" id="sb-clock" title="Calendar">
          <span id="sb-time"></span><span class="sb-sep">·</span><span id="sb-date"></span>
        </button>
      </div>
      <div class="sb-right">
        <button class="sb-icon" id="sb-notif" title="Notifications"><span data-icon="bell"></span><i id="notif-dot" class="notif-dot hidden"></i></button>
        <button class="sb-icon" id="sb-wifi" title="Wi-Fi"><span data-icon="wifi"></span></button>
        <button class="sb-icon" id="sb-audio" title="Audio"><span data-icon="volume"></span></button>
        <button class="sb-icon" id="sb-battery" title="Battery"><span data-battery></span><span id="sb-batt-num"></span></button>
        <button class="sb-icon" id="sb-power" title="Power"><span data-icon="power"></span></button>
      </div>
    </header>

    <!-- bottom dock / taskbar -->
    <div id="dock" class="dock"></div>

    <!-- app launcher -->
    <div id="launcher" class="launcher hidden" role="dialog" aria-label="App launcher">
      <div class="launcher-search">
        <span data-icon="search"></span>
        <input id="launcher-input" type="text" placeholder="Search apps" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="launcher-section-title" id="launcher-title">All apps</div>
      <div class="launcher-grid" id="launcher-grid"></div>
      <div class="launcher-footer"><span>Debian Minerva</span><span id="launcher-count"></span></div>
    </div>

    <!-- quick settings -->
    <div id="qs" class="panel qs-panel hidden" role="dialog" aria-label="Quick settings">
      <div class="qs-head">
        <div class="qs-clock" id="qs-clock"></div>
        <div class="qs-date" id="qs-date"></div>
        <button class="icon-btn" id="qs-power" title="Power"><span data-icon="power"></span></button>
      </div>
      <div class="qs-sliders">
        <div class="qs-slider-row"><span data-icon="sun"></span><input id="qs-brightness" type="range" min="20" max="100" value="82"></div>
        <div class="qs-slider-row"><span data-icon="volume"></span><input id="qs-volume" type="range" min="0" max="100" value="65"></div>
      </div>
      <div class="qs-tiles" id="qs-tiles"></div>
      <div class="qs-foot">
        <button class="text-btn" id="qs-settings"><span data-icon="settings"></span> Settings</button>
        <button class="text-btn" id="qs-edit">Edit tiles</button>
      </div>
    </div>

    <!-- notifications -->
    <div id="notif-panel" class="panel notif-panel hidden" role="dialog" aria-label="Notifications">
      <div class="notif-head">
        <strong>Notifications</strong>
        <div>
          <button class="text-btn" id="notif-clear">Clear all</button>
          <button class="icon-btn" id="notif-close"><span data-icon="close"></span></button>
        </div>
      </div>
      <div class="notif-list" id="notif-list"></div>
      <div class="notif-foot">Do not disturb <button class="switch" id="notif-dnd"><span></span></button></div>
    </div>

    <!-- overview / virtual desktops -->
    <div id="overview" class="overview hidden">
      <div class="ov-top">
        <div class="ov-title">Activities</div>
        <input id="ov-search" class="ov-search" type="text" placeholder="Type to search apps…">
        <button class="icon-btn" id="ov-close"><span data-icon="close"></span></button>
      </div>
      <div class="ov-workspaces" id="ov-workspaces"></div>
      <div class="ov-windows" id="ov-windows"></div>
      <div class="ov-hint">Drag a window onto a workspace to move it · <kbd>+</kbd> add workspace</div>
    </div>

    <!-- context menus -->
    <div id="context-menu" class="context-menu hidden"></div>
    <div id="power-menu" class="context-menu hidden"></div>
    <div id="calendar-pop" class="panel calendar-pop hidden"></div>
    <div id="wifi-pop" class="panel pop hidden" role="dialog" aria-label="Wi-Fi"></div>
    <div id="audio-pop" class="panel pop hidden" role="dialog" aria-label="Audio"></div>
    <div id="battery-pop" class="panel pop hidden" role="dialog" aria-label="Power and display"></div>
    <div id="power-pop" class="panel pop hidden" role="dialog" aria-label="Power"></div>
    <div id="settings-win" class="settings-win hidden" role="dialog" aria-label="Settings"></div>

    <!-- misc -->
    <div id="snap-preview" class="snap-preview hidden"></div>
    <div id="toasts" class="toasts"></div>
    <div id="search-results" class="search-results hidden"></div>
    <div id="lock-screen" class="lock-screen hidden"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/panelwin.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
